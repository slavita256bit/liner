<!DOCTYPE html>
<html lang="en">
<style>
    .row {
        display: flex;
        flex-direction: row;
        gap: 10px
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Streaming</title>
</head>
<body>
    <img id="stream" src="" alt="Video Stream" />
    <div class="row">
        <p>Curvature: </p>
        <p id="curvature"></p>
    </div>
    <div class="row">
        <p>Delta: </p>
        <p id="delta"></p>
    </div>
    <div class="row">
        <p>Time to process: </p>
        <p id="time"></p>
    </div>
    <div class="row">
        <p>FPS: </p>
        <p id="fps"></p>
    </div>

    <script>
        const socket = new WebSocket('ws://192.168.246.103:8000');

        socket.onmessage = function(event) {
            data = JSON.parse(event.data)
            document.getElementById('stream').src = 'data:image/jpeg;base64,' + data['img'];
            document.getElementById('time').innerText = data['time'].toFixed(2);
            //document.getElementById('fps').innerText = Math.floor(60 / data['time']);
            document.getElementById('curvature').innerText = data['curvature'].toFixed(2);
            document.getElementById('delta').innerText = data['delta'].toFixed(2);
        };
    </script>
</body>
</html>
